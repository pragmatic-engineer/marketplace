version: 2
updates:
  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: weekly
    commit-message:
      prefix: "ci"
    groups:
      actions:
        patterns: ["*"]
  - package-ecosystem: cargo
    directory: /checks
    schedule:
      interval: monthly
    commit-message:
      prefix: "chore"
    groups:
      cargo:
        patterns: ["*"]
