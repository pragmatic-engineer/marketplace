name: release

# The playbook release workflow opens release/vX.Y.Z here, which pins the
# playbook entry to the tag vX.Y.Z (ADR 0039 in pragmatic-engineer/playbook).
# When that pull request merges, this workflow tags the merge commit vX.Y.Z and
# publishes a release with the notes "playbook vA -> vB". The tag ruleset lets
# only the igorjs app create v tags, so the job mints an app token from the
# organization secrets. Without them it stops with a notice, and the playbook
# release workflow tags and releases through the API instead. Running it again
# keeps a tag that points at the same commit and a release that exists.
on:
  pull_request:
    types: [closed]
    branches: [main]

permissions:
  contents: read

jobs:
  tag:
    # Only a merged pull request from the app, on a release branch of this
    # repository.
    if: >-
      github.event.pull_request.merged == true
      && github.event.pull_request.user.login == 'igorjs[bot]'
      && startsWith(github.event.pull_request.head.ref, 'release/v')
      && github.event.pull_request.head.repo.full_name == github.repository
    runs-on: ubuntu-latest
    timeout-minutes: 10
    # On the job, so only release runs queue here and a closed pull request
    # of another kind cannot cancel a pending one.
    concurrency:
      group: release
      cancel-in-progress: false
    steps:
      - uses: step-security/harden-runner@dc2769abcc0fcfbadfc1df54081c1608579ef6b2 # v2.22.2
        with:
          egress-policy: block
          allowed-endpoints: >
            api.github.com:443
            github.com:443

      # Read through env, so the values never appear in the script.
      - name: Check for the app credentials
        id: bot
        env:
          BOT_APP_CLIENT_ID: ${{ secrets.BOT_APP_CLIENT_ID }}
          BOT_APP_PRIVATE_KEY: ${{ secrets.BOT_APP_PRIVATE_KEY }}
        run: |
          if [ -n "$BOT_APP_CLIENT_ID" ] && [ -n "$BOT_APP_PRIVATE_KEY" ]; then
            echo "configured=true" >> "$GITHUB_OUTPUT"
          else
            echo "configured=false" >> "$GITHUB_OUTPUT"
            echo "::notice::BOT_APP_CLIENT_ID or BOT_APP_PRIVATE_KEY is not set, so this run does not tag. The playbook release workflow tags and releases through the API instead."
          fi

      - uses: actions/create-github-app-token@64ab729a6294000f5aa4a4bc0b73d1f32bc45510 # v3.3.0
        if: steps.bot.outputs.configured == 'true'
        id: app-token
        with:
          client-id: ${{ secrets.BOT_APP_CLIENT_ID }}
          private-key: ${{ secrets.BOT_APP_PRIVATE_KEY }}
          permission-contents: write

      - name: Check out the merge commit
        if: steps.bot.outputs.configured == 'true'
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ github.event.pull_request.merge_commit_sha }}
          fetch-depth: 2
          persist-credentials: false

      - name: Tag and release
        if: steps.bot.outputs.configured == 'true'
        env:
          GH_TOKEN: ${{ steps.app-token.outputs.token }}
          REPO: ${{ github.repository }}
          BRANCH: ${{ github.event.pull_request.head.ref }}
          SHA: ${{ github.event.pull_request.merge_commit_sha }}
          PR: ${{ github.event.pull_request.number }}
        run: |
          set -euo pipefail
          tag="${BRANCH#release/}"
          if [[ ! "$tag" =~ ^v[0-9]+\.[0-9]+\.[0-9]+$ ]]; then
            echo "::error::branch ${BRANCH} does not name a release vX.Y.Z." >&2
            exit 1
          fi
          if [[ ! "$SHA" =~ ^[0-9a-f]{40}$ ]]; then
            echo "::error::pull request #${PR} has no merge commit." >&2
            exit 1
          fi
          pin='.plugins[] | select(.name == "playbook") | .source.ref // empty'
          now="$(jq -r "$pin" .claude-plugin/marketplace.json)"
          if [ "$now" != "$tag" ]; then
            echo "::error::#${PR} pins playbook to '${now}', not ${tag}. Nothing was changed." >&2
            exit 1
          fi
          before="$(git show HEAD^:.claude-plugin/marketplace.json | jq -r "$pin")"

          # The tag covers the pin and nothing else, even when someone pushed
          # to the app's branch before the merge.
          changed="$(git diff --name-only HEAD^ HEAD)"
          if [ "$changed" != .claude-plugin/marketplace.json ]; then
            echo "::error::#${PR} changes more than .claude-plugin/marketplace.json: ${changed//$'\n'/ }. Nothing was changed." >&2
            exit 1
          fi
          strip='del(.metadata.version) | if .metadata == {} then del(.metadata) else . end
            | (.plugins[] | select(.name == "playbook") | .source) |= del(.ref)'
          if [ "$(git show HEAD^:.claude-plugin/marketplace.json | jq -S "$strip")" != "$(jq -S "$strip" .claude-plugin/marketplace.json)" ]; then
            echo "::error::#${PR} changes more than the playbook ref and metadata.version. Nothing was changed." >&2
            exit 1
          fi

          # The merge commit must be on main, so the tag never lands on a
          # commit outside its history.
          status="$(gh api "repos/${REPO}/compare/${SHA}...main" --jq .status)"
          if [ "$status" != identical ] && [ "$status" != ahead ]; then
            echo "::error::${SHA} is not on main (compare says ${status}). Nothing was changed." >&2
            exit 1
          fi

          # The tag. One that exists must point at the merge commit, and an
          # annotated tag is followed to its commit.
          if ref="$(gh api "repos/${REPO}/git/ref/tags/${tag}")"; then
            type="$(jq -r .object.type <<<"$ref")"
            at="$(jq -r .object.sha <<<"$ref")"
            if [ "$type" = tag ]; then
              at="$(gh api "repos/${REPO}/git/tags/${at}" --jq .object.sha)"
            fi
            if [ "$at" != "$SHA" ]; then
              echo "::error::${tag} points at ${at}, not at the merge commit ${SHA} of #${PR}. Nothing was changed." >&2
              exit 1
            fi
            echo "${tag} already points at ${SHA}."
          elif [ "$(jq -r '.status // empty' <<<"$ref")" = 404 ]; then
            gh api -X POST "repos/${REPO}/git/refs" -f "ref=refs/tags/${tag}" -f "sha=${SHA}" >/dev/null
            echo "Tagged ${SHA} as ${tag}."
          else
            echo "::error::could not read the tag ${tag}: ${ref}" >&2
            exit 1
          fi

          if gh release view "$tag" --repo "$REPO" >/dev/null 2>&1; then
            echo "The release ${tag} exists."
            exit 0
          fi
          printf 'playbook %s -> %s, from #%s.\n' "${before:-the default branch}" "$tag" "$PR" >"$RUNNER_TEMP/notes.md"
          gh release create "$tag" --repo "$REPO" --verify-tag --latest \
            --title "$tag" --notes-file "$RUNNER_TEMP/notes.md"
          echo "Published the release ${tag}."
