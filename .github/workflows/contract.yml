#
# The contract with the playbook binary. intents.json lists the intents the
# plugin relies on. This job downloads the latest released playbook binary,
# checks its SHA256SUMS entry and compares `playbook tools map --json` with the
# list. A listed intent the binary lacks is a warning, and a failure only when
# intents.json marks it required. A daily run catches a binary release that
# drops an intent.

name: contract

on:
  pull_request:
  merge_group:
  workflow_dispatch:
  schedule:
    - cron: "41 6 * * *"

permissions:
  contents: read

concurrency:
  group: contract-${{ github.ref }}
  cancel-in-progress: true

jobs:
  contract:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: step-security/harden-runner@9af89fc71515a100421586dfdb3dc9c984fbf411 # v2.19.4
        with:
          egress-policy: block
          allowed-endpoints: >
            api.github.com:443
            github.com:443
            objects.githubusercontent.com:443
            release-assets.githubusercontent.com:443

      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Lint the script
        run: shellcheck --severity=warning scripts/*.sh

      - name: Download the latest playbook release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          tag="$(gh release list --repo pragmatic-engineer/playbook --limit 100 --json tagName,isDraft,isPrerelease \
            --jq '[.[] | select(.isDraft == false and .isPrerelease == false) | .tagName | select(test("^v[0-9]+\\.[0-9]+\\.[0-9]+$"))] | first // empty')"
          [ -n "$tag" ] || { echo "::error::no playbook release found"; exit 1; }
          asset="playbook-${tag#v}-x86_64-unknown-linux-musl"
          mkdir -p "$RUNNER_TEMP/playbook"
          gh release download "$tag" --repo pragmatic-engineer/playbook \
            --pattern "$asset" --pattern SHA256SUMS --dir "$RUNNER_TEMP/playbook"
          (cd "$RUNNER_TEMP/playbook" && grep " ${asset}\$" SHA256SUMS | sha256sum -c -)
          chmod +x "$RUNNER_TEMP/playbook/$asset"
          echo "PLAYBOOK_BIN=$RUNNER_TEMP/playbook/$asset" >> "$GITHUB_ENV"

      - name: Compare intents.json with the tool map
        run: scripts/check-intents.sh "$PLAYBOOK_BIN"
